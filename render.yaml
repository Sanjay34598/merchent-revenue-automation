services:
  # Python / FastAPI Backend Web Service
  - type: web
    name: merchintell-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: pos-data-disk
      mountPath: /var/data
      sizeGB: 1

  # React / Vite Frontend Static Site
  - type: static
    name: merchintell-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: merchintell-backend
          property: host
